name: FPT Le Minh voice samples

on:
  workflow_dispatch:
    inputs:
      record:
        description: Call FPT Neo and create the three listening-review MP3s
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  samples:
    if: inputs.record == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate isolated samples
        run: node tools/fpt-voice-samples.mts --record
        env:
          FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
          FPT_RECORD: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: fpt-le-minh-samples
          path: temp/fpt-samples/*.mp3
          if-no-files-found: error
