name: Fruit Parade behavioural checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/games/fruitparade*.ts'
      - 'js/games/trongnu*.ts'
      - 'js/main.ts'
      - 'js/netgames.ts'
      - 'tests/fruit-parade*.mts'
      - 'tests/unit/fruitparade.test.*'
      - 'tests/harness.*'
      - '.github/workflows/fruit-parade.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fruit-parade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install the existing test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Build TypeScript and verify pure engine and protocol
        run: |
          node tools/build.mts
          node --test tests/unit/fruitparade.test.mjs
          tests/node_modules/.bin/tsc --noEmit --strict --module es2022 --moduleResolution bundler --target es2022 --skipLibCheck js/games/fruitparade-engine.ts js/games/fruitparade-session.ts js/games/fruitparade-input.ts js/games/trongnu-rules.ts
      - name: Start the local game server
        run: python3 -m http.server 8765 > /tmp/parade-server.log 2>&1 &
      - name: Real UI completion, language, touch, input and two-browser state
        run: node tests/fruit-parade-browser.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fruit-parade-browser-evidence
          path: docs/v1.02-fruit-parade/
          retention-days: 30
