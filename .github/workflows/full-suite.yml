# The full suite on GitHub (owner, 13 Oct AEDT: "plan it on top of today's method"; brief docs/cores/tasks/github-suite.md).
# On a pull request into main (and by hand): the checks are split over 8 of GitHub's machines (tests/suite.mjs --shard),
# one at a time on each (no overload); a last job joins the results, writes one summary on the pull request, marks it
# "Full suite", and keeps the refreshed code map (tests/check-map.json, tests/check-times.json) as an artifact for Release
# to commit. The speed checks (perf, startup, battery) are not run here: GitHub's machines are shared, so the Release chat
# runs them on its own machine. Free for a public repository. Uses no Claude usage.
name: Full suite
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number (empty: the branch you run it on)'
        required: false
      all:
        description: 'Check every reading item, film and voice area instead of rotating samples'
        type: boolean
        default: false
      # (Release, 30 Oct AEDT) a chosen set of checks on the 8 machines while the Release machine runs its own: no "Full
      # suite" status, no pull request summary and no code map (those come only from a whole run)
      only:
        description: 'Only these checks, comma-separated (empty: every check)'
        required: false
        default: ''
concurrency:
  group: full-suite-${{ github.event.pull_request.number || inputs.pr || github.ref }}${{ inputs.only && '-only' || '' }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  which:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Find the code to check
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          if [ -n "$N" ]; then sha=$(gh pr view "$N" --json headRefOid -q .headRefOid); else sha=$GITHUB_SHA; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "pr=$N" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/statuses/$sha" -f state=pending -f context='Full suite' \
            -f description='Running on 8 machines' -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null

  postgres:
    name: Management PostgreSQL
    needs: which
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: management_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d management_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.which.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Validate real SQL and finance transactions
        id: sql
        env:
          MANAGEMENT_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/management_ci_test
          MANAGEMENT_TEST_RESULT_PATH: postgres-evidence.json
        run: node tests/management/postgres-integration.mjs
      - name: Record SQL result for the full-suite summary
        if: always()
        env:
          SQL_OUTCOME: ${{ steps.sql.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const ok=process.env.SQL_OUTCOME==='success';
          const evidence=fs.existsSync('postgres-evidence.json')?JSON.parse(fs.readFileSync('postgres-evidence.json','utf8')):null;
          fs.mkdirSync('share',{recursive:true});
          fs.writeFileSync('share/suite-result.json',JSON.stringify({managementpostgres:{ok,note:ok?`${evidence.cases.length} real PostgreSQL transaction/migration/finance checks passed`:'SQL checks failed or did not complete; see job log'}}));
          if(evidence)fs.writeFileSync('share/postgres-evidence.json',JSON.stringify(evidence,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-postgres
          path: share
          retention-days: 7

  share:
    needs: which
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        k: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.which.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audio verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Get the checks ready (browser and test server)
        run: |
          npm ci --no-audit --no-fund
          cd tests && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
          cd .. && (python3 -m http.server 8765 >/dev/null 2>&1 &)
      - name: Start local synthetic test services
        run: |
          npm ci --prefix tests/services --no-audit --no-fund
          node tests/services/start.cjs > /tmp/sv-test-services.log 2>&1 &
          node tests/services/wait.cjs
      - name: Run this machine's share
        env:
          SV_SEED: ${{ github.run_id }}
        run: cd tests && SV_URL=http://localhost:8765/ node suite.mjs ${{ (inputs.all || github.head_ref == 'work/v1.02-fruit-parade') && '--all' || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }} --shard ${{ matrix.k }}/8 --no-solo --jobs 1
      - name: Keep the results
        if: always()
        run: |
          mkdir -p share
          cp tests/out/suite-result.json share/ 2>/dev/null || true
          cp -r tests/out/cover share/ 2>/dev/null || true
          cp tests/out/fail-*.png share/ 2>/dev/null || true
          # Preserve detector observations as well as outcomes when a synthetic freeze fails.
          cp tests/out/tester-freeze-observation.json share/ 2>/dev/null || true
          cp -r tests/out/owner-studio-folds share/ 2>/dev/null || true
          cp -r tests/out/reported-screens share/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-${{ matrix.k }}
          path: share
          retention-days: 7

  collect:
    needs: [which, share, postgres]
    # (not when the run was cancelled, e.g. by a newer push: it would report every check as "did not run")
    if: ${{ !cancelled() && needs.which.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.which.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: share-*
          path: tests/shards
      - name: Join the results
        id: join
        run: cd tests && node suite.mjs --collect shards; s=$?; cat out/suite-summary.md >> "$GITHUB_STEP_SUMMARY"; exit $s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-map
          path: |
            tests/check-map.json
            tests/check-times.json
          retention-days: 30
      # (r79, 17 Oct AEDT: cloud chats cannot download artifacts, their network blocks GitHub's storage, but git works.
      # So the same two files also go on the branch code-map, one commit per run on top of the last, never forced.
      # Release takes them with: git fetch origin code-map && git checkout FETCH_HEAD -- tests/check-map.json tests/check-times.json
      # A failed push here (two runs at once) never fails the suite.)
      - name: Keep the code map on the branch code-map
        if: always() && !inputs.only && hashFiles('tests/check-map.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.which.outputs.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          d=$(mktemp -d)
          git clone -q --depth 1 --branch code-map "$url" "$d" 2>/dev/null || { git init -q "$d"; git -C "$d" checkout -q -b code-map; }
          mkdir -p "$d/tests"; cp tests/check-map.json tests/check-times.json "$d/tests/"
          cd "$d"; git add tests
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Code map from run $GITHUB_RUN_ID ($REF at ${SHA:0:8}) [skip netlify]" || exit 0
          git push -q "$url" HEAD:refs/heads/code-map
      - name: Tell the pull request
        if: always() && !inputs.only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.which.outputs.sha }}
          PR: ${{ needs.which.outputs.pr }}
          OUTCOME: ${{ steps.join.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; else state=failure; fi
          head=$(head -1 tests/out/suite-summary.md 2>/dev/null | sed 's/^## //' | cut -c1-120)
          gh api "repos/$GH_REPO/statuses/$SHA" -f state=$state -f context='Full suite' \
            -f description="${head:-no result}" -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null
          if [ -n "$PR" ] && [ -f tests/out/suite-summary.md ]; then
            { cat tests/out/suite-summary.md; echo; echo "[The run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)"; } > body.md
            gh pr comment "$PR" --body-file body.md
          fi
