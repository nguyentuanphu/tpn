name: FPT Le Minh reviewed public labels
on:
  push:
    branches: [work/fpt-v102-labels-20261026]
    paths:
      - docs/fpt-v102-labels-20261026/inventory.json
      - tools/fpt-label-delta.mts
      - .github/workflows/fpt-label-delta.yml
  workflow_dispatch:
permissions:
  contents: write
# Same provider lock as the baseline job: never run two FPT batches together.
concurrency:
  group: fpt-leminh-full-20261025
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/work/fpt-v102-labels-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fpt-v102-labels-20261026
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install decoder before any paid request
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Record only fixed public game lines; fully decode every MP3
        env:
          FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
        run: node tools/fpt-label-delta.mts
      - name: Preserve complete or partial recordings on the working branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f temp/fpt-recordings/labels-delta.json ]; then
            gh auth setup-git
            git config user.name 'Sparkle Valley voices'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f temp/fpt-recordings/
            if ! git diff --cached --quiet; then
              git commit -m 'Record reviewed Le Minh public labels [skip netlify]' -m 'Co-Authored-By: Claude <noreply@anthropic.com>'
              for attempt in 1 2 3; do
                git pull --no-rebase origin work/fpt-v102-labels-20261026
                if git push origin HEAD:work/fpt-v102-labels-20261026; then exit 0; fi
              done
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: le-minh-public-labels
          path: temp/fpt-recordings/
          retention-days: 30
