name: FPT Le Minh reviewed arcade delta
on:
  push:
    branches: ['work/**', 'release/**', 'voices/**']
    paths:
      - docs/v1.02-orchard-arcade/voice-delta.json
  workflow_dispatch:
    inputs:
      inventory:
        description: Optional reviewed public JSON under docs/voice-recording-delta; blank preserves the legacy arcade batch
        required: false
        type: string
permissions:
  contents: write
# Same provider lock as the baseline job: never run two FPT batches together.
concurrency:
  group: ${{ inputs.inventory && format('reviewed-public-{0}', github.run_id) || 'fpt-leminh-full-20261025' }}
  cancel-in-progress: false
jobs:
  record:
    if: (!inputs.inventory) && (startsWith(github.ref, 'refs/heads/work/') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/voices/'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install decoder before any paid request
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Record only fixed public game lines; fully decode every MP3
        env:
          FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
        run: node tools/fpt-arcade-delta.mts
      - name: Preserve complete or partial recordings on the working branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RECORDING_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -f temp/fpt-recordings/arcade-delta.json ]; then
            gh auth setup-git
            git config user.name 'Sparkle Valley voices'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f temp/fpt-recordings/
            if ! git diff --cached --quiet; then
              git commit -m 'Record reviewed Le Minh arcade delta [skip netlify]' -m 'Co-Authored-By: Claude <noreply@anthropic.com>'
              saved=false
              for attempt in 1 2 3; do
                git pull --no-rebase origin "$RECORDING_BRANCH"
                if git push origin "HEAD:$RECORDING_BRANCH"; then saved=true; break; fi
              done
              test "$saved" = true
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: le-minh-arcade-delta
          path: temp/fpt-recordings/
          retention-days: 30

  reviewed_public:
    if: github.event_name == 'workflow_dispatch' && inputs.inventory != ''
    uses: ./.github/workflows/public-voice-delta.yml
    with:
      inventory: ${{ inputs.inventory }}
      save_to_branch: true
    secrets: inherit
