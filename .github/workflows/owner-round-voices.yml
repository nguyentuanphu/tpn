# Record this review branch without merging its code into voices/daily or main.
name: Owner round voices
on:
  push:
    branches: [work/v1.02-fruit-parade, work/owner-round-20261014, work/owner-repair-20261014, work/owner-repair-checkpoint-20261015]
    paths: ['js/**', 'tools/voice-extra.json', 'tools/make-voice-pack.mts', 'tools/mixed-voice-inventory.mts', '.github/workflows/owner-round-voices.yml']
  workflow_dispatch:
    inputs:
      save_to_branch:
        description: 'Commit recordings to this release branch (never main)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: owner-round-voices
  cancel-in-progress: true
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: australiaeast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build TypeScript sources
        run: node tools/build.mts
      - name: Record missing fixed lines and verify coverage
        run: |
          test -n "$AZURE_SPEECH_KEY" || { echo '::error::Azure voice credential unavailable'; exit 1; }
          node tools/make-voice-pack.mts --engine azure
          node tools/make-voice-pack.mts --cover
      - name: Collect only new recordings and updated indexes
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess
          changed = subprocess.check_output(['git','diff','--name-only','--','voices'], text=True).splitlines()
          new = subprocess.check_output(['git','ls-files','--others','--exclude-standard','voices'], text=True).splitlines()
          for name in sorted(set(changed + new)):
              source = pathlib.Path(name)
              if source.is_file():
                  target = pathlib.Path('voices-delta') / source
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          pathlib.Path('voices-delta').mkdir(exist_ok=True)
          pathlib.Path('voices-delta/result.json').write_text(json.dumps({'source': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'coverage': 'passed', 'changedFiles': sorted(set(changed + new))}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: owner-round-voices-${{ github.sha }}
          path: voices-delta/
          if-no-files-found: error
          retention-days: 14

      - name: Save recordings to the release branch when requested
        if: (inputs.save_to_branch || github.ref_name == 'work/v1.02-fruit-parade') && (startsWith(github.ref_name, 'release/') || github.ref_name == 'work/v1.02-fruit-parade')
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "Sparkle Valley voices"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voices
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record missing release instructions"
          for attempt in 1 2 3; do
            git pull --no-rebase origin "$RELEASE_BRANCH"
            if git push origin "HEAD:$RELEASE_BRANCH"; then exit 0; fi
          done
          exit 1
