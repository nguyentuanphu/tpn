name: FPT Le Minh full Vietnamese pack
on:
  push:
    branches: [work/fpt-leminh-full-20261025]
    paths:
      - .github/workflows/fpt-le-minh-bulk.yml
      - tools/fpt-recorder.mts
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fpt-leminh-full-20261025
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/work/fpt-leminh-full-20261025'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fpt-leminh-full-20261025
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install decoder before recording
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Configure checkpoint identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'Sparkle Valley voices'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Record and verify this part, saving every 50 clips
        env:
          FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FPT_SHARD: ${{ matrix.shard }}
          FPT_SHARDS: 4
        run: node tools/fpt-recorder.mts --checkpoint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpt-leminh-part-${{ matrix.shard }}
          path: temp/fpt-recordings/
          if-no-files-found: warn
          retention-days: 30
