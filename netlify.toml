# Netlify settings (used for both drag-and-drop and Git deploys).
[build]
  publish = "."
  # (Analytics & Infra, 10 Oct) pack the start-up scripts in Netlify's own copy (tools/bundle.mts); a drag-and-drop zip
  # is already packed by build-netlify.sh. If packing cannot run, the site keeps the plain modules.
  # (owner, 16 Oct AEDT: TypeScript, batch 0) first every .ts becomes the .js beside it (tools/build.mts); if that fails
  # the deploy stops and the live site stays as it was. Packing may still fall back to the plain modules.
  command = "node tools/build.mts && (node tools/bundle.mts . || true)"
[build.environment]
  # type stripping (tools/build.mts) needs Node 22.18 or newer; the same version the checks and the exe use
  NODE_VERSION = "22.22.0"

# Small server pieces (Git deploys only; a drag-and-drop zip has none of them):
#   /api/hello        devices counting players, anonymously (netlify/functions/hello.mts)
#   /studio/api/*     Sparkle Studio online, behind the grown-ups' password (netlify/functions/studio.mts)
#   /api/turn         the voice relay details for friends on different networks (netlify/functions/turn.mts)
#   /api/live         releases and festival changes from Studio (netlify/functions/live.mts)
#   /api/family/*     a family photo, only with the family code (netlify/functions/family.mts, round R privacy)
#   /api/tester       tester devices' reports and their status (netlify/functions/tester.mts, owner 12 Oct: PRIV-016)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["studio/version.json", "content/management-catalogue.json", "netlify/lib/management/storage/001-management.sql", "netlify/lib/management/storage/002-finance.sql"]

# Parent website at /home (and direct URL sparklevalley.au/home)
[[redirects]]
  from = "/home"
  to = "/home/index.html"
  status = 200
[[redirects]]
  from = "/home/*"
  to = "/home/index.html"
  status = 200

# Sparkle Studio online: the same dashboard as SparkleStudio.exe (studio/ui), at /studio/
[[redirects]]
  from = "/studio"
  to = "/studio/ui/index.html"
  status = 200
[[redirects]]
  from = "/studio/"
  to = "/studio/ui/index.html"
  status = 200
# the game, as the dashboard's pages load it (the Map and Voices pages read the game's own files)
[[redirects]]
  from = "/studio/game/*"
  to = "/:splat"
  status = 200
[[redirects]]
  from = "/studio/voices/*"
  to = "/voices/:splat"
  status = 200

# The service worker must never be cached, or devices would miss updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    # allow the microphone for the family-voice recorder and online calls; block camera/geolocation
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/studio/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
