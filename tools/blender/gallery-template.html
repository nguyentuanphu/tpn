<title>Sparkle Valley Characters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: a toy-catalogue page: a sticky shelf of tabs, each character on its own felt-green shelf of photos */
:root {
  --bg: #f6f4ec; --panel: #ffffff; --ink: #24301f; --muted: #5d6a55; --line: #dcd9cb;
  --accent: #5f8a3e; --accent-soft: #e5eedb; --girl: #b5527a; --girl-soft: #f6e3ec; --boy: #2f6f8f; --boy-soft: #dfedf4;
  --photo: #f3ead7;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161a14; --panel: #20261d; --ink: #e9eedf; --muted: #a8b39c; --line: #343c2f;
  --accent: #9cc77a; --accent-soft: #2a3624; --girl: #ec9bbd; --girl-soft: #3a2531; --boy: #8cc4e0; --boy-soft: #1f3039; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161a14; --panel: #20261d; --ink: #e9eedf; --muted: #a8b39c; --line: #343c2f;
  --accent: #9cc77a; --accent-soft: #2a3624; --girl: #ec9bbd; --girl-soft: #3a2531; --boy: #8cc4e0; --boy-soft: #1f3039; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px }
.top { padding-block: 40px 8px }
.eyebrow { font: 700 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent) }
h1 { font: 800 clamp(34px, 6vw, 56px)/1.05 var(--display); margin: 8px 0 10px; text-wrap: balance }
.intro { max-width: 64ch; color: var(--muted); margin: 0 }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; margin-block: 20px 8px }
nav a { flex: none; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px; padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line) }
nav a:hover, nav a:focus-visible { background: var(--accent-soft); border-color: var(--accent); outline: none }
section { padding-top: 28px; scroll-margin-top: 64px }
h2 { font: 800 30px/1.1 var(--display); margin: 0 0 4px; text-wrap: balance }
.lede { color: var(--muted); margin: 0 0 18px; max-width: 64ch }
h3 { font: 800 24px/1.1 var(--display); margin: 0 }
h4 { font: 700 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px }
figure { margin: 0; display: grid; gap: 6px; min-width: 0 }
figcaption { font-size: 13px; color: var(--muted); font-weight: 600 }
.zoom { padding: 0; border: 0; background: var(--photo); border-radius: 12px; overflow: hidden; cursor: zoom-in; display: block; width: 100% }
.zoom:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.zoom img { display: block; width: 100%; height: auto; transition: transform .25s ease }
.zoom:hover img { transform: scale(1.03) }
.friend { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 18px; scroll-margin-top: 64px }
.friend header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.about { margin: 6px 0 14px; color: var(--muted) }
.chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px }
.chip.f { background: var(--girl-soft); color: var(--girl) } .chip.m { background: var(--boy-soft); color: var(--boy) }
.views { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.moods { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0 }
.card p { margin: 0; color: var(--muted); font-size: 14px }
.card h3 { font-size: 20px }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.card.wide { grid-column: 1 / -1 }
@media (max-width: 860px) { .moods { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
@media (max-width: 560px) { .views { grid-template-columns: repeat(2, minmax(0, 1fr)) } .moods { grid-template-columns: repeat(3, minmax(0, 1fr)) } .friend { padding: 14px } }
dialog { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1400px); max-height: 92vh }
dialog::backdrop { background: rgba(10, 14, 8, .82) }
dialog img { display: block; max-width: min(96vw, 1400px); max-height: 86vh; border-radius: 14px; background: var(--photo) }
dialog p { color: #f1f4ea; text-align: center; font-weight: 600; margin: 8px 0 0 }
.close { position: absolute; top: 8px; right: 8px; border: 0; border-radius: 999px; width: 40px; height: 40px; font: 700 20px/1 var(--body); background: rgba(255,255,255,.9); color: #222; cursor: pointer }
@media (prefers-reduced-motion: reduce) { .zoom img { transition: none } .zoom:hover img { transform: none } }
</style>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Sparkle Valley · Thung Lũng Lấp Lánh</div>
    <h1>Characters</h1>
    <p class="intro">The four friends and the village neighbours at the game's size, rendered in Blender: every side, every mood, the wardrobe and the vehicles. Tap a picture to see it larger.</p>
  </header>
  <nav aria-label="Sections">{{NAV}}</nav>
  {{BODY}}
</div>
<dialog id="big"><button class="close" id="close" aria-label="Close">×</button><img id="bigimg" alt=""><p id="bigcap"></p></dialog>
<script>
const dlg = document.getElementById('big'), img = document.getElementById('bigimg'), cap = document.getElementById('bigcap');
document.querySelectorAll('.zoom').forEach(b => b.addEventListener('click', () => {
  img.src = b.dataset.src; img.alt = b.querySelector('img').alt; cap.textContent = b.closest('figure').querySelector('figcaption').textContent;
  const card = b.closest('article'); const h = card && card.querySelector('h3'); if (h) cap.textContent = h.textContent + ' · ' + cap.textContent;
  dlg.showModal();
}));
document.getElementById('close').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
</script>
