<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">One reviewed release reaches both audiences</title><desc id="desc">Existing publication gates remain. Management adds evidence, not automatic deployment. A guide cannot promise content absent from its game build. A failed or skipped required check must stay visible; no automatic approval is created.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52637b"/></marker></defs><rect width="1200" height="780" rx="24" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="40" y="52" font-size="30" font-weight="700" fill="#172a45">One reviewed release reaches both audiences</text><text x="40" y="84" font-size="17" fill="#52637b">Existing publication gates remain. Management adds evidence, not automatic deployment.</text><path d="M350,202 L445,202" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="292.5" y="189.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="397.5" y="207.0" text-anchor="middle" font-size="14" fill="#354962">Same source SHA</text><path d="M755,202 L850,202" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="189.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="207.0" text-anchor="middle" font-size="14" fill="#354962">Matching assets</text><path d="M1005,264 L1005,390" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="900.0" y="314.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="1005.0" y="332.0" text-anchor="middle" font-size="14" fill="#354962">Evidence</text><path d="M850,452 L755,452" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="439.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="457.0" text-anchor="middle" font-size="14" fill="#354962">Approved release</text><path d="M445,452 L350,452" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="292.5" y="439.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="397.5" y="457.0" text-anchor="middle" font-size="14" fill="#354962">Report outcomes</text><rect x="40" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="58" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="58" y="194" font-size="20" font-weight="700" fill="#172a45">1. Source changes</text><text x="58" y="219" font-size="16" fill="#354962">Stable IDs, game and Studio</text><rect x="445" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="463" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="463" y="194" font-size="20" font-weight="700" fill="#172a45">2. Review website</text><text x="463" y="219" font-size="16" fill="#354962">Regenerate facts; review copy</text><rect x="850" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="868" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="868" y="194" font-size="20" font-weight="700" fill="#172a45">3. Verify candidate</text><text x="868" y="219" font-size="16" fill="#354962">CI + device visuals + budgets</text><rect x="40" y="390" width="310" height="124" rx="16" fill="#fff1dc" stroke="#945600" stroke-width="2"/><text x="58" y="417" font-size="12" font-weight="700" fill="#945600">PROPOSED</text><text x="58" y="444" font-size="20" font-weight="700" fill="#172a45">6. Observe rollout</text><text x="58" y="469" font-size="16" fill="#354962">Version and receipt coverage</text><rect x="445" y="390" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="463" y="417" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="463" y="444" font-size="20" font-weight="700" fill="#172a45">5. Netlify deploy</text><text x="463" y="469" font-size="16" fill="#354962">Game + /home + functions</text><rect x="850" y="390" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="868" y="417" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="868" y="444" font-size="20" font-weight="700" fill="#172a45">4. Owner approval</text><text x="868" y="469" font-size="16" fill="#354962">Explicit yes, deploy for round</text><text x="40" y="700" font-size="16" fill="#354962">A guide cannot promise content absent from its game build. A failed or skipped required check must stay visible; no</text><text x="40" y="723" font-size="16" fill="#354962">automatic approval is created.</text></g></svg>