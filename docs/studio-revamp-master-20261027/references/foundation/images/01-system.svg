<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">One product, three experiences</title><desc id="desc">Read top to bottom. Green exists; amber is proposed; purple holds restricted data. Studio does not replace local saves. The website receives approved facts and explanations, never private child saves.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52637b"/></marker></defs><rect width="1200" height="780" rx="24" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="40" y="52" font-size="30" font-weight="700" fill="#172a45">One product, three experiences</text><text x="40" y="84" font-size="17" fill="#52637b">Read top to bottom. Green exists; amber is proposed; purple holds restricted data.</text><path d="M600,254 L195,340" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="292.5" y="284.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="397.5" y="302.0" text-anchor="middle" font-size="14" fill="#354962">Build game</text><path d="M600,254 L600,340" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="495.0" y="284.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="600.0" y="302.0" text-anchor="middle" font-size="14" fill="#354962">Read facts</text><path d="M600,254 L1005,340" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="284.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="302.0" text-anchor="middle" font-size="14" fill="#354962">Review + build</text><path d="M195,464 L600,550" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="292.5" y="494.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="397.5" y="512.0" text-anchor="middle" font-size="14" fill="#354962">Reporting</text><path d="M1005,464 L600,550" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="494.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="512.0" text-anchor="middle" font-size="14" fill="#354962">Aggregate counts</text><path d="M600,550 L600,464" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="495.0" y="494.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="600.0" y="512.0" text-anchor="middle" font-size="14" fill="#354962">Management views</text><rect x="445" y="130" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="463" y="157" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="463" y="184" font-size="20" font-weight="700" fill="#172a45">Versioned facts</text><text x="463" y="209" font-size="16" fill="#354962">Activity IDs, stories, rewards</text><rect x="40" y="340" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="58" y="367" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="58" y="394" font-size="20" font-weight="700" fill="#172a45">Children play</text><text x="58" y="419" font-size="16" fill="#354962">Local progress; optional reports</text><rect x="445" y="340" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="463" y="367" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="463" y="394" font-size="20" font-weight="700" fill="#172a45">Administrators manage</text><text x="463" y="419" font-size="16" fill="#354962">Content, releases, reports</text><rect x="850" y="340" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="868" y="367" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="868" y="394" font-size="20" font-weight="700" fill="#172a45">Parents understand</text><text x="868" y="419" font-size="16" fill="#354962">Reviewed website and guides</text><rect x="445" y="550" width="310" height="124" rx="16" fill="#fff1dc" stroke="#945600" stroke-width="2"/><text x="463" y="577" font-size="12" font-weight="700" fill="#945600">PROPOSED</text><text x="463" y="604" font-size="20" font-weight="700" fill="#172a45">Management summaries</text><text x="463" y="629" font-size="16" fill="#354962">Connect evidence and decisions</text><text x="40" y="700" font-size="16" fill="#354962">Studio does not replace local saves. The website receives approved facts and explanations, never private child</text><text x="40" y="723" font-size="16" fill="#354962">saves.</text></g></svg>