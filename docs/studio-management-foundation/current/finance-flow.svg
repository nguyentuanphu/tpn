<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
<title id="title">Finance: from source invoice to private Studio evidence</title>
<desc id="description">Manual ledger rows and CSV go through validation, a read-only preview and explicit confirmation into one PostgreSQL transaction. Immutable revisions, audit and batch identity protect corrections and retries. Summary metrics feed the private Studio screen. Budget and coverage saves have their own validated revisioned path. Only aggregate game counts enter financial unit costs; no child names, payments or automatic billing changes are connected.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#245786"/></marker><marker id="optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b681e"/></marker></defs>
<rect width="1200" height="750" rx="18" fill="#f3f6fb"/>
<g font-family="system-ui,sans-serif" fill="#172a45"><text x="40" y="40" font-size="25" font-weight="700">Finance follows evidence, not assumptions</text><text x="40" y="65" font-size="15">Private authenticated routes · exact minor units · explicit tax and FX · no payments</text></g>
<g fill="white" stroke="#93adc8" stroke-width="2"><rect x="40" y="95" width="300" height="125" rx="14"/><rect x="450" y="95" width="300" height="125" rx="14"/><rect x="860" y="95" width="300" height="125" rx="14"/><rect x="860" y="310" width="300" height="185" rx="14"/><rect x="450" y="310" width="300" height="185" rx="14"/><rect x="40" y="310" width="300" height="185" rx="14"/><rect x="40" y="550" width="300" height="100" rx="14"/><rect x="450" y="550" width="300" height="100" rx="14"/><rect x="860" y="550" width="300" height="100" rx="14"/></g>
<g fill="none" stroke="#245786" stroke-width="3" marker-end="url(#arrow)"><path d="M340 157H448"/><path d="M750 157H858"/><path d="M1010 220V308"/><path d="M860 400H752"/><path d="M450 400H342"/><path d="M340 600H375V680H1130V497"/><path d="M1010 550V497"/></g>
<path d="M600 550V497" fill="none" stroke="#9b681e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#optional)"/>
<g font-family="system-ui,sans-serif" fill="#172a45" font-size="17">
<text x="60" y="125" font-weight="700">1. Manual line or CSV</text><text x="60" y="155">Provider + account alias</text><text x="60" y="181">Document + source line ID</text><text x="60" y="205">Original amount, currency, tax</text>
<text x="470" y="125" font-weight="700">2. Validate and preview</text><text x="470" y="155">Dates, signs, FX and revision</text><text x="470" y="181">New / duplicate / correction</text><text x="470" y="205">No write at this stage</text>
<text x="880" y="125" font-weight="700">3. Confirm reviewed rows</text><text x="880" y="155">Actor + reason</text><text x="880" y="181">Stable operation UUID</text><text x="880" y="205">Exact preview fingerprint</text>
<text x="880" y="340" font-weight="700">4. One SQL transaction</text><text x="880" y="370">Latest line + immutable versions</text><text x="880" y="396">Audit + batch deduplication</text><text x="880" y="422">Settings + month budgets</text><text x="880" y="448">All rows commit or roll back</text><text x="880" y="476">Netlify Database, PostgreSQL</text>
<text x="470" y="340" font-weight="700">5. Qualified summaries</text><text x="470" y="370">Invoice / cash views separate</text><text x="470" y="396">Actual / estimate / commitment</text><text x="470" y="422">FX and coverage limits visible</text><text x="470" y="448">Conditional forecast / unit cost</text><text x="470" y="476">Missing evidence stays unavailable</text>
<text x="60" y="340" font-weight="700">6. Private Studio Finance</text><text x="60" y="370">Review totals and source lines</text><text x="60" y="396">Correct, reconcile or void</text><text x="60" y="422">Inspect preserved history</text><text x="60" y="448">Export authenticated CSV</text><text x="60" y="476">Explicit finance permissions</text>
<text x="60" y="579" font-weight="700">Budget and coverage</text><text x="60" y="607">Separate revision + reason</text><text x="60" y="634">Validated save; retained audit</text>
<text x="470" y="579" font-weight="700">Game aggregate counts only</text><text x="470" y="607">Reporting installations / minutes</text><text x="470" y="634">Optional comparable denominator</text>
<text x="880" y="579" font-weight="700">Native private connection</text><text x="880" y="607">NETLIFY_DB_URL per context</text><text x="880" y="634">Never sent to the browser</text>
<text x="600" y="672" font-size="14">Budget save path</text><text x="40" y="725" font-size="16">Source identity stays stable. Child names are not financial keys. Website payments and revenue attribution are not implemented.</text>
</g></svg>
