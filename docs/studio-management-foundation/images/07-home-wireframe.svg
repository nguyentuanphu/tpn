<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title"><title id="title">Proposed Studio management Home wireframe, no live business data</title><rect width="1200" height="820" fill="#f3f6fb"/><g font-family="Arial,sans-serif"><rect width="1200" height="100" fill="#172a45"/><text x="32" y="44" fill="white" font-size="27" font-weight="700">Sparkle Studio | Management Home</text><text x="32" y="76" fill="#d8e4f3" font-size="16">PROPOSED WIREFRAME - labels only, no live or fabricated business figures</text><text x="32" y="143" font-size="17" fill="#354962">Period: selected range | Build: selected version | Traffic: ordinary | Data received: timestamp</text><rect x="32" y="175" width="356" height="150" rx="16" fill="white" stroke="#becde0"/><text x="52" y="209" font-size="22" font-weight="700" fill="#172a45">Attention</text><text x="52" y="248" font-size="18" fill="#24486f">Problems needing review</text><text x="52" y="280" font-size="15" fill="#52637b">Evidence -&gt; owner -&gt; next action</text><rect x="422" y="175" width="356" height="150" rx="16" fill="white" stroke="#becde0"/><text x="442" y="209" font-size="22" font-weight="700" fill="#172a45">Audience</text><text x="442" y="248" font-size="18" fill="#24486f">Reporting installations</text><text x="442" y="280" font-size="15" fill="#52637b">Period, source day and late data</text><rect x="812" y="175" width="356" height="150" rx="16" fill="white" stroke="#becde0"/><text x="832" y="209" font-size="22" font-weight="700" fill="#172a45">Experience</text><text x="832" y="248" font-size="18" fill="#24486f">Measured reliability</text><text x="832" y="280" font-size="15" fill="#52637b">Samples, build and device class</text><rect x="32" y="355" width="356" height="150" rx="16" fill="white" stroke="#becde0"/><text x="52" y="389" font-size="22" font-weight="700" fill="#172a45">Content</text><text x="52" y="428" font-size="18" fill="#24486f">Activity performance</text><text x="52" y="460" font-size="15" fill="#52637b">Participations vs exact attempts</text><rect x="422" y="355" width="356" height="150" rx="16" fill="white" stroke="#becde0"/><text x="442" y="389" font-size="22" font-weight="700" fill="#172a45">Money</text><text x="442" y="428" font-size="18" fill="#24486f">Actual / estimate / budget</text><text x="442" y="460" font-size="15" fill="#52637b">Source currency and completeness</text><rect x="812" y="355" width="356" height="150" rx="16" fill="white" stroke="#becde0"/><text x="832" y="389" font-size="22" font-weight="700" fill="#172a45">Release</text><text x="832" y="428" font-size="18" fill="#24486f">Available / applied / unknown</text><text x="832" y="460" font-size="15" fill="#52637b">Exact source and eligible cohort</text><rect x="32" y="550" width="1136" height="162" rx="16" fill="white" stroke="#becde0"/><text x="54" y="585" font-size="21" font-weight="700" fill="#172a45">Attention list</text><text x="54" y="623" font-size="17" fill="#354962">Priority | observed evidence | affected build/device scope | owner | next action</text><text x="54" y="665" font-size="16" fill="#52637b">Missing data is unavailable. Offline devices are unconfirmed. Clicks are not completed gameplay.</text><text x="32" y="766" font-size="17" fill="#354962">Keep navigation: Home | Family | Game | Analytics | Setup</text></g></svg>