<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">How a game action reaches a Studio number</title><desc id="desc">Example: completing one activity. Existing counters remain supported. Current counts cannot reconstruct every attempt. New event IDs and terminal outcomes must be added before showing exact funnels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52637b"/></marker></defs><rect width="1200" height="780" rx="24" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="40" y="52" font-size="30" font-weight="700" fill="#172a45">How a game action reaches a Studio number</text><text x="40" y="84" font-size="17" fill="#52637b">Example: completing one activity. Existing counters remain supported.</text><path d="M350,202 L445,202" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="292.5" y="189.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="397.5" y="207.0" text-anchor="middle" font-size="14" fill="#354962">Event listener</text><path d="M755,202 L850,202" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="189.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="207.0" text-anchor="middle" font-size="14" fill="#354962">Bounded batch</text><path d="M1005,264 L1005,370" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="900.0" y="304.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="1005.0" y="322.0" text-anchor="middle" font-size="14" fill="#354962">Accepted counts</text><path d="M350,432 L445,432" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="292.5" y="419.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="397.5" y="437.0" text-anchor="middle" font-size="14" fill="#354962">New read adapter</text><path d="M850,432 L755,432" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="419.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="437.0" text-anchor="middle" font-size="14" fill="#354962">Read aggregates</text><rect x="40" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="58" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="58" y="194" font-size="20" font-weight="700" fill="#172a45">1. Child plays</text><text x="58" y="219" font-size="16" fill="#354962">ActivityCompleted on event bus</text><rect x="445" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="463" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="463" y="194" font-size="20" font-weight="700" fill="#172a45">2. Device queues counts</text><text x="463" y="219" font-size="16" fill="#354962">Local outbox, day and build</text><rect x="850" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="868" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="868" y="194" font-size="20" font-weight="700" fill="#172a45">3. Server validates</text><text x="868" y="219" font-size="16" fill="#354962">/api/hello; receipt and retry</text><rect x="850" y="370" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="868" y="397" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="868" y="424" font-size="20" font-weight="700" fill="#172a45">4. Store and summarise</text><text x="868" y="449" font-size="16" fill="#354962">players; bots kept separately</text><rect x="445" y="370" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="463" y="397" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="463" y="424" font-size="20" font-weight="700" fill="#172a45">5. Studio reads</text><text x="463" y="449" font-size="16" fill="#354962">/studio/api/players</text><rect x="40" y="370" width="310" height="124" rx="16" fill="#fff1dc" stroke="#945600" stroke-width="2"/><text x="58" y="397" font-size="12" font-weight="700" fill="#945600">PROPOSED</text><text x="58" y="424" font-size="20" font-weight="700" fill="#172a45">Future attempt ledger</text><text x="58" y="449" font-size="16" fill="#354962">Exact start-to-outcome linking</text><text x="40" y="700" font-size="16" fill="#354962">Current counts cannot reconstruct every attempt. New event IDs and terminal outcomes must be added before showing</text><text x="40" y="723" font-size="16" fill="#354962">exact funnels.</text></g></svg>