<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Saved is different from applied</title><desc id="desc">The top row exists. The lower row requires new delivery instrumentation. Offline devices remain unconfirmed. Publishing a file or saving a switch is never evidence that every installation has applied it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52637b"/></marker></defs><rect width="1200" height="780" rx="24" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="40" y="52" font-size="30" font-weight="700" fill="#172a45">Saved is different from applied</text><text x="40" y="84" font-size="17" fill="#52637b">The top row exists. The lower row requires new delivery instrumentation.</text><path d="M350,202 L445,202" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="292.5" y="189.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="397.5" y="207.0" text-anchor="middle" font-size="14" fill="#354962">Save succeeds</text><path d="M755,202 L850,202" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="189.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="207.0" text-anchor="middle" font-size="14" fill="#354962">Next refresh</text><path d="M195,264 L195,390" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="90.0" y="314.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="195.0" y="332.0" text-anchor="middle" font-size="14" fill="#354962">New contract</text><path d="M1005,264 L600,390" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="314.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="332.0" text-anchor="middle" font-size="14" fill="#354962">New acknowledgement</text><path d="M350,452 L445,452" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="292.5" y="439.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="397.5" y="457.0" text-anchor="middle" font-size="14" fill="#354962">Same revision</text><path d="M755,452 L850,452" stroke="#52637b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="697.5" y="439.0" width="210" height="26" rx="6" fill="#f7f9fc"/><text x="802.5" y="457.0" text-anchor="middle" font-size="14" fill="#354962">Observed evidence</text><rect x="40" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="58" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="58" y="194" font-size="20" font-weight="700" fill="#172a45">1. Save in Studio</text><text x="58" y="219" font-size="16" fill="#354962">Validate scope and permission</text><rect x="445" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="463" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="463" y="194" font-size="20" font-weight="700" fill="#172a45">2. Available online</text><text x="463" y="219" font-size="16" fill="#354962">Public /api/live response</text><rect x="850" y="140" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="868" y="167" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="868" y="194" font-size="20" font-weight="700" fill="#172a45">3. Device fetches</text><text x="868" y="219" font-size="16" fill="#354962">Use and keep live settings</text><rect x="40" y="390" width="310" height="124" rx="16" fill="#fff1dc" stroke="#945600" stroke-width="2"/><text x="58" y="417" font-size="12" font-weight="700" fill="#945600">PROPOSED</text><text x="58" y="444" font-size="20" font-weight="700" fill="#172a45">A. Assign revision</text><text x="58" y="469" font-size="16" fill="#354962">Expected revision prevents races</text><rect x="445" y="390" width="310" height="124" rx="16" fill="#fff1dc" stroke="#945600" stroke-width="2"/><text x="463" y="417" font-size="12" font-weight="700" fill="#945600">PROPOSED</text><text x="463" y="444" font-size="20" font-weight="700" fill="#172a45">B. Receive applied receipt</text><text x="463" y="469" font-size="16" fill="#354962">Revision, hash, outcome; no saves</text><rect x="850" y="390" width="310" height="124" rx="16" fill="#fff1dc" stroke="#945600" stroke-width="2"/><text x="868" y="417" font-size="12" font-weight="700" fill="#945600">PROPOSED</text><text x="868" y="444" font-size="20" font-weight="700" fill="#172a45">C. Show coverage</text><text x="868" y="469" font-size="16" fill="#354962">Eligible cohort + unconfirmed</text><text x="40" y="700" font-size="16" fill="#354962">Offline devices remain unconfirmed. Publishing a file or saving a switch is never evidence that every installation</text><text x="40" y="723" font-size="16" fill="#354962">has applied it.</text></g></svg>