<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Keep the data boundaries understandable</title><desc id="desc">These collections serve different purposes and grant different permissions. There is deliberately no arrow from private saves/photos to the public website. Photo codes, statistics codes and progress copies are not interchangeable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52637b"/></marker></defs><rect width="1200" height="780" rx="24" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="40" y="52" font-size="30" font-weight="700" fill="#172a45">Keep the data boundaries understandable</text><text x="40" y="84" font-size="17" fill="#52637b">These collections serve different purposes and grant different permissions.</text><rect x="40" y="140" width="310" height="124" rx="16" fill="#f0eaff" stroke="#6942a8" stroke-width="2"/><text x="58" y="167" font-size="12" font-weight="700" fill="#6942a8">PRIVATE</text><text x="58" y="194" font-size="20" font-weight="700" fill="#172a45">Progress and backups</text><text x="58" y="219" font-size="16" fill="#354962">On-device saves; explicit copies</text><rect x="445" y="140" width="310" height="124" rx="16" fill="#f0eaff" stroke="#6942a8" stroke-width="2"/><text x="463" y="167" font-size="12" font-weight="700" fill="#6942a8">PRIVATE</text><text x="463" y="194" font-size="20" font-weight="700" fill="#172a45">Private family photos</text><text x="463" y="219" font-size="16" fill="#354962">Approved device membership</text><rect x="850" y="140" width="310" height="124" rx="16" fill="#f0eaff" stroke="#6942a8" stroke-width="2"/><text x="868" y="167" font-size="12" font-weight="700" fill="#6942a8">PRIVATE</text><text x="868" y="194" font-size="20" font-weight="700" fill="#172a45">Statistics family code</text><text x="868" y="219" font-size="16" fill="#354962">Links statistics only</text><rect x="40" y="390" width="310" height="124" rx="16" fill="#e7f5ee" stroke="#18734b" stroke-width="2"/><text x="58" y="417" font-size="12" font-weight="700" fill="#18734b">EXISTING</text><text x="58" y="444" font-size="20" font-weight="700" fill="#172a45">Public website</text><text x="58" y="469" font-size="16" fill="#354962">Approved facts and guides</text><rect x="445" y="390" width="310" height="124" rx="16" fill="#f0eaff" stroke="#6942a8" stroke-width="2"/><text x="463" y="417" font-size="12" font-weight="700" fill="#6942a8">PRIVATE</text><text x="463" y="444" font-size="20" font-weight="700" fill="#172a45">Restricted analytics</text><text x="463" y="469" font-size="16" fill="#354962">May contain first names today</text><rect x="850" y="390" width="310" height="124" rx="16" fill="#fff1dc" stroke="#945600" stroke-width="2"/><text x="868" y="417" font-size="12" font-weight="700" fill="#945600">PROPOSED</text><text x="868" y="444" font-size="20" font-weight="700" fill="#172a45">Private finance</text><text x="868" y="469" font-size="16" fill="#354962">Owner-only ledger initially</text><text x="40" y="700" font-size="16" fill="#354962">There is deliberately no arrow from private saves/photos to the public website. Photo codes, statistics codes and</text><text x="40" y="723" font-size="16" fill="#354962">progress copies are not interchangeable.</text></g></svg>