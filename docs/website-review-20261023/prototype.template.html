function closeSite(){if(document.querySelector("#image-dialog").open)document.querySelector("#image-dialog").close();if(menu.open)menu.close();if(dialog.open)dialog.close();host.append(site);site.classList.remove('overlay');document.body.style.overflow='';translate();if(opener)opener.focus()}
function openSite(event){opener=event?.currentTarget||document.activeElement;site.classList.add('overlay');dialog.append(site);document.body.style.overflow='hidden';dialog.showModal();translate();document.querySelector('#close-site').focus()}
function setMode(next){closeSite();mode=next;document.body.dataset.mode=mode;host.style.display=mode==='website'?'block':'none';document.querySelector('#game-stage').style.display=mode==='website'?'none':'block';document.querySelector('#settings-panel').classList.remove('open');document.querySelector('.welcome-website').style.display=mode==='game'?'none':'flex';document.querySelectorAll('[data-mode-button]').forEach(b=>b.classList.toggle('active',b.dataset.modeButton===mode));window.scrollTo(0,0)}
document.querySelectorAll('[data-mode-button]').forEach(b=>b.onclick=()=>setMode(b.dataset.modeButton));document.querySelectorAll('[data-open-site]').forEach(b=>b.onclick=openSite);document.querySelectorAll('[data-action=play]').forEach(b=>b.onclick=()=>dialog.open?closeSite():setMode('game'));document.querySelector('#close-site').onclick=closeSite;document.querySelector('#language-button').onclick=()=>{lang=lang==='en'?'vi':'en';translate()};document.querySelector('#settings-button').onclick=()=>document.querySelector('#settings-panel').classList.toggle('open');document.querySelectorAll('[data-open-menu]').forEach(b=>b.onclick=()=>menu.showModal());document.querySelector('#close-menu').onclick=()=>menu.close();dialog.addEventListener('cancel',e=>{e.preventDefault();closeSite()});menu.addEventListener('click',e=>{if(e.target===menu)menu.close()});
const imageDialog=document.querySelector('#image-dialog');let imageSource=null,imageOpener=null;
function showImage(img){document.querySelector('#large-image').src=img.dataset[lang==='en'?'imageEn':'imageVi']||img.src;document.querySelector('#large-image').alt=img.dataset[lang==='en'?'altEn':'altVi'];document.querySelector('#image-caption').textContent=document.querySelector('#large-image').alt}
document.querySelectorAll('[data-view-image]').forEach(b=>b.onclick=()=>{imageSource=b.querySelector('img');imageOpener=b;showImage(imageSource);imageDialog.showModal();document.querySelector('#close-image').focus()});
document.querySelector('#close-image').onclick=()=>imageDialog.close();imageDialog.addEventListener('close',()=>imageOpener?.focus());imageDialog.addEventListener('click',e=>{if(e.target===imageDialog)imageDialog.close()});
const search=document.querySelector('#quest-search'),items=[...document.querySelectorAll('.guide-item')];
const normal=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d');
items.forEach(el=>el.dataset.search=normal([...el.querySelectorAll('[data-en]')].map(n=>n.dataset.en+' '+n.dataset.vi).join(' ')));
function filterQuests(){const q=normal(search.value.trim());let found=0;items.forEach(el=>{el.hidden=el.dataset.festivalVisible==='false'||!!q&&!el.dataset.search.includes(q);if(!el.hidden)found++});document.querySelector('#quest-results').textContent=q?(lang==='en'?`${found} matching guide entries. Clear search to see all.`:`Có ${found} mục phù hợp. Xóa tìm kiếm để xem tất cả.`):(lang==='en'?`${items.filter(el=>el.dataset.festivalVisible!=='false').length} guide entries. Search in English or Vietnamese.`:`Có ${items.filter(el=>el.dataset.festivalVisible!=='false').length} mục hướng dẫn. Tìm bằng tiếng Anh hoặc tiếng Việt.`)}
document.querySelectorAll('[data-quiz-answer]').forEach(b=>b.onclick=()=>{const result=document.querySelector('#sample-quiz-result'),ok=b.dataset.quizAnswer==='thanks';result.dataset.en=ok?'Yes! Thank you is a kind way to recognise someone’s help. Try saying it in both languages together.':'Good night is for bedtime. Try the other answer!';result.dataset.vi=ok?'Đúng rồi! Cảm ơn là lời tử tế khi được giúp đỡ. Cùng thử nói bằng cả hai ngôn ngữ nhé.':'Chúc ngủ ngon dùng lúc đi ngủ. Thử đáp án còn lại nhé!';result.textContent=result.dataset[lang]});
search.oninput=filterQuests;document.querySelector('#clear-search').onclick=()=>{search.value='';filterQuests();search.focus()};
function route(){const id=decodeURIComponent(location.hash.slice(1)||'discover'),guide=id==='quest-guide'||id.startsWith('guide-')||id.startsWith('quest-');const festival=id==='festivals'||(id.startsWith('festival-')&&id!=='festival-overview');document.querySelector('.home-page').hidden=guide||festival;document.querySelector('.quest-page').hidden=!guide;document.querySelector('.festival-page').hidden=!festival;if(festival&&id.startsWith('festival-')&&id!=='festival-overview'){festivalFilter='all';applyFestivalFilter()}document.querySelectorAll('a[href="#quest-guide"]').forEach(a=>guide?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));if(id.startsWith('quest-')&&search.value){search.value='';filterQuests()}const target=document.getElementById(id);if(target?.matches('details'))target.open=true;if(target&&!target.closest('[hidden]')){target.scrollIntoView({behavior:'instant',block:'start'});if(location.hash){target.setAttribute('tabindex','-1');target.focus({preventScroll:true})}}}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a||(!site.contains(a)&&!menu.contains(a)))return;e.preventDefault();if(menu.open)menu.close();const next=a.getAttribute('href');if(location.hash===next)route();else location.hash=next});window.addEventListener('hashchange',route);
let printState=[];window.addEventListener('beforeprint',()=>{printState=[...document.querySelectorAll('.quest-page details')].map(el=>[el,el.open]);printState.forEach(([el])=>el.open=true)});window.addEventListener('afterprint',()=>printState.forEach(([el,open])=>el.open=open));document.querySelector('#print-guide').onclick=()=>window.print();
let festivalFilter='all';const festivalYear=document.querySelector('#festival-year');
function applyFestivalCountdowns(){const day=864e5,now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()),n=k=>lang==='en'?(k===1?'1 day':k+' days'):k+' ngày',at=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};document.querySelectorAll('.festival-countdown').forEach(el=>{const iso=JSON.parse(el.dataset.festIso),len=+el.dataset.festDays||1,build=+el.dataset.festBuild||3;const next=Object.values(iso).filter(Boolean).map(at).find(t=>t+len*day>today);if(next==null){el.hidden=true;return}el.hidden=false;const to=Math.round((next-today)/day),deco=to-build,parts=[];if(to<=0){el.textContent=lang==='en'?'On today: decorations, the hunt and the festival game':'Hôm nay: trang trí, truy tìm và trò chơi lễ hội';el.classList.add('now');return}el.classList.remove('now');parts.push(deco>0?(lang==='en'?'Decorations in '+n(deco):'Trang trí sau '+n(deco)):(lang==='en'?'Decorations up now':'Đã trang trí'));if(el.dataset.festHunt){const hs=Math.max(next-7*day,at(el.dataset.festHunt)),h=Math.round((hs-today)/day);if(hs<next+len*day)parts.push(h>0?(lang==='en'?'Festival hunt in '+n(h):'Truy tìm lễ hội sau '+n(h)):(lang==='en'?'Festival hunt on now':'Đang truy tìm lễ hội'))}parts.push(lang==='en'?(to===1?'Festival day tomorrow':'Festival day in '+n(to)):(to===1?'Ngày lễ là ngày mai':'Ngày lễ sau '+n(to)));el.innerHTML=parts.map(x=>'<span>'+x+'</span>').join('')})}
function applyFestivalDates(){document.querySelectorAll('[data-festival-dates]').forEach(el=>{const p=JSON.parse(el.dataset.festivalDates)[festivalYear.value];el.textContent=p[lang==='en'?0:1]});applyFestivalCountdowns()}
function applyFestivalFilter(){let n=0;document.querySelectorAll('.festival-card').forEach(el=>{el.hidden=!window.svFestivalVisible(el.id.slice('festival-'.length))||festivalFilter!=='all'&&el.dataset.festivalGroup!==festivalFilter;if(!el.hidden)n++});document.querySelectorAll('[data-festival-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.festivalFilter===festivalFilter)));document.querySelector('#festival-count').textContent=lang==='en'?`${n} events shown · Studio calendar`:`Hiện ${n} dịp · lịch từ Studio`}
festivalYear.onchange=applyFestivalDates;document.querySelectorAll('[data-festival-filter]').forEach(b=>b.onclick=()=>{festivalFilter=b.dataset.festivalFilter;applyFestivalFilter()});
document.addEventListener('sv-festivals-change',()=>{filterQuests();applyFestivalDates();applyFestivalFilter()});
translate();route();
</script></body></html>
